<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Mehara</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="pragma" content="no-cache" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --emerald-900: #04261a;
                --emerald-800: #063d2a;
                --emerald-700: #0a5c3f;
                --emerald-500: #169c6a;
                --maroon-900: #3d0812;
                --maroon-700: #6e1423;
                --maroon-500: #8f1d30;
                --cream: #f7efe4;
                --gold: #d9b779;
            }
            * { box-sizing: border-box; }
            html, body { height: 100%; margin: 0; }
            body {
                overflow: hidden;
                background: var(--emerald-900);
                color: var(--cream);
                font-family: "Cormorant Garamond", Georgia, serif;
                -webkit-font-smoothing: antialiased;
            }
            .hidden { display: none !important; }

            /* ---------- satin backdrop ---------- */
            .satin {
                position: fixed; inset: -20%;
                background:
                    radial-gradient(120% 80% at 20% 10%, rgba(255,255,255,.10), transparent 55%),
                    linear-gradient(115deg,
                        var(--emerald-900) 0%, var(--emerald-700) 18%, var(--emerald-800) 30%,
                        #0d6e4b 42%, var(--emerald-900) 55%, var(--emerald-700) 70%,
                        var(--emerald-800) 84%, var(--emerald-900) 100%);
                background-size: 100% 100%, 300% 300%;
                animation: drape 18s ease-in-out infinite alternate;
            }
            .satin::after { /* moving sheen */
                content: ""; position: absolute; inset: 0;
                background: linear-gradient(100deg, transparent 35%, rgba(255,255,255,.13) 48%, rgba(255,255,255,.04) 52%, transparent 65%);
                background-size: 250% 100%;
                animation: sheen 9s ease-in-out infinite;
                mix-blend-mode: screen;
            }
            @keyframes drape { from { background-position: 0 0, 0% 50%; } to { background-position: 0 0, 100% 50%; } }
            @keyframes sheen { 0% { background-position: 150% 0; } 60%, 100% { background-position: -100% 0; } }

            /* ---------- petals ---------- */
            #petals { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
            .petal {
                position: absolute; top: -40px;
                width: 18px; height: 14px;
                border-radius: 150% 0 150% 0;
                background: radial-gradient(circle at 30% 30%, #b3364d, var(--maroon-700) 60%, var(--maroon-900));
                opacity: .9;
                animation: fall linear forwards;
            }
            .petal.leaf { background: radial-gradient(circle at 30% 30%, #2bbf85, var(--emerald-500) 55%, var(--emerald-800)); border-radius: 0 150% 0 150%; }
            @keyframes fall {
                to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); }
            }

            /* ---------- corner florals ---------- */
            .floral { position: fixed; width: min(42vw, 260px); z-index: 2; pointer-events: none; opacity: .95; }
            .floral.tl { top: -14px; left: -14px; }
            .floral.br { bottom: -14px; right: -14px; transform: rotate(180deg); }

            /* ---------- stage ---------- */
            .stage {
                position: relative; z-index: 3;
                min-height: 100%; display: grid; place-items: center;
                padding: 16px;
            }
            .loading { color: var(--gold); font-size: 1.2rem; font-style: italic; letter-spacing: .1em; }

            /* envelope */
            .envelope {
                position: relative;
                width: min(88vw, 360px); aspect-ratio: 1.45;
                cursor: pointer;
                perspective: 900px;
                transition: transform .6s cubic-bezier(.2,.8,.2,1);
                filter: drop-shadow(0 18px 30px rgba(0,0,0,.45));
            }
            .envelope:hover { transform: translateY(-4px); }
            .env-back, .env-front, .env-flap {
                position: absolute; inset: 0;
                background: linear-gradient(135deg, #f8efe2, #eadcc6 55%, #f3e7d6);
                border-radius: 6px;
            }
            .env-front {
                z-index: 3;
                clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
                background: linear-gradient(160deg, #f1e4d1, #e2d1b6);
            }
            .env-flap {
                z-index: 4;
                clip-path: polygon(0 0, 100% 0, 50% 58%);
                background: linear-gradient(180deg, #efe1cc, #dcc9ac);
                transform-origin: top center;
                transition: transform .8s cubic-bezier(.4,0,.2,1), z-index 0s .4s;
            }
            .seal {
                position: absolute; z-index: 5;
                left: 50%; top: 52%;
                width: 72px; height: 72px; margin: -36px 0 0 -36px;
                border-radius: 50%;
                background: radial-gradient(circle at 35% 30%, #b0283f, var(--maroon-700) 55%, var(--maroon-900));
                box-shadow: inset 0 0 0 5px rgba(0,0,0,.12), inset 0 -4px 8px rgba(0,0,0,.35), 0 4px 10px rgba(0,0,0,.35);
                display: grid; place-items: center;
                transition: transform .5s, opacity .5s;
                animation: pulse 2.4s ease-in-out infinite;
            }
            .seal svg { width: 44px; height: 44px; }
            @keyframes pulse { 50% { transform: scale(1.07); } }
            .hint {
                position: absolute; left: 0; right: 0; bottom: -46px;
                text-align: center; font-style: italic; color: var(--gold); font-size: 1.1rem; letter-spacing: .05em;
                transition: opacity .4s;
            }
            .letter {
                position: absolute; z-index: 2;
                left: 6%; right: 6%; top: 8%; bottom: 6%;
                background: linear-gradient(180deg, #fffaf2, #f6ecdd);
                border-radius: 4px;
                transition: transform .9s cubic-bezier(.2,.9,.25,1) .35s;
            }
            .envelope.open { cursor: default; transform: translateY(18vh); }
            .envelope.open:hover { transform: translateY(18vh); }
            .envelope.open .env-flap { transform: rotateX(180deg); z-index: 1; }
            .envelope.open .seal { transform: scale(0) rotate(-40deg); opacity: 0; animation: none; }
            .envelope.open .hint { opacity: 0; }
            .envelope.open .letter { transform: translateY(-62%); }

            /* the card that rises out of the envelope */
            .card {
                position: fixed; z-index: 6;
                left: 50%; top: 50%;
                width: min(90vw, 380px);
                transform: translate(-50%, -30%) scale(.9);
                opacity: 0; pointer-events: none;
                padding: 34px 28px 28px;
                text-align: center;
                color: var(--maroon-900);
                background:
                    radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.9), transparent 60%),
                    linear-gradient(180deg, #fffaf2, #f4e8d6);
                border-radius: 10px;
                border: 1px solid rgba(217,183,121,.6);
                box-shadow: 0 30px 60px rgba(0,0,0,.45), inset 0 0 0 6px rgba(255,255,255,.5), inset 0 0 0 7px rgba(217,183,121,.45);
                transition: opacity .7s ease 1s, transform .9s cubic-bezier(.2,.9,.25,1) 1s;
            }
            .card.show { opacity: 1; transform: translate(-50%, -62%) scale(1); pointer-events: auto; }
            .card h1 {
                margin: 0; font-family: "Great Vibes", cursive; font-weight: 400;
                font-size: clamp(2.8rem, 12vw, 3.6rem); color: var(--maroon-700); line-height: 1.05;
            }
            .card p { margin: 6px 0 20px; font-size: 1.15rem; font-style: italic; color: var(--emerald-800); }
            .card .divider { width: 120px; margin: 6px auto 10px; display: block; }
            .field {
                position: relative; margin-bottom: 14px;
            }
            #staticrypt-password {
                width: 100%;
                font: inherit; font-size: 1.15rem; text-align: center; letter-spacing: .15em;
                color: var(--maroon-900);
                padding: 13px 16px;
                border: 1px solid rgba(110,20,35,.35);
                border-radius: 999px;
                background: rgba(255,255,255,.7);
                outline: none;
                transition: border-color .3s, box-shadow .3s;
            }
            #staticrypt-password::placeholder { color: rgba(61,8,18,.45); letter-spacing: .05em; font-style: italic; }
            #staticrypt-password:focus { border-color: var(--emerald-500); box-shadow: 0 0 0 4px rgba(22,156,106,.18); }
            .unlock {
                width: 100%;
                font: inherit; font-size: 1.15rem; letter-spacing: .12em; text-transform: uppercase;
                color: var(--cream);
                padding: 13px 16px;
                border: 0; border-radius: 999px; cursor: pointer;
                background: linear-gradient(115deg, var(--maroon-900), var(--maroon-500) 45%, #a8293f 52%, var(--maroon-700));
                background-size: 220% 100%;
                box-shadow: 0 8px 18px rgba(61,8,18,.35);
                transition: background-position .8s, transform .2s;
            }
            .unlock:hover { background-position: 100% 0; }
            .unlock:active { transform: scale(.98); }
            .error {
                min-height: 1.4em; margin: 12px 0 0;
                font-style: italic; color: var(--maroon-500); font-size: 1.05rem;
                opacity: 0; transition: opacity .3s;
            }
            .error.on { opacity: 1; }
            .shake { animation: shake .5s; }
            @keyframes shake {
                20%, 60% { transform: translate(calc(-50% - 8px), -62%); }
                40%, 80% { transform: translate(calc(-50% + 8px), -62%); }
            }

            /* unlock transition */
            .bloom {
                position: fixed; z-index: 10; left: 50%; top: 50%;
                width: 20px; height: 20px; margin: -10px;
                border-radius: 50%;
                background: radial-gradient(circle, var(--maroon-500), var(--maroon-900) 60%, var(--emerald-900));
                transform: scale(0);
                pointer-events: none;
            }
            .bloom.go { transition: transform 1.3s cubic-bezier(.7,0,.3,1); transform: scale(220); }

            @media (prefers-reduced-motion: reduce) {
                .satin, .satin::after, .seal { animation: none; }
                .petal { display: none; }
            }
        </style>
    </head>
