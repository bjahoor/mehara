<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mehara</title>
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --fg: #fafaf9; --muted: #a8a29e; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      padding: 16px; background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, sans-serif; text-align: center;
    }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); font-weight: 600; letter-spacing: -0.02em; }
    p { margin-top: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Mehara</h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
